name: Quality

on:
  pull_request:
  push:
    branches:
      - fast-track/mvp

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Runtime packages are the release gate. The current picomatch advisory
      # affects only lint/test tooling and has no patched npm release yet.
      - run: npm audit --omit=dev --audit-level=high
